<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Đố Vui Nội Bộ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Be+Vietnam+Pro:wght@400;500;600&display=swap">
<style>
/* Concept: phòng điều khiển cho quản trị viên (hai cột: mã QR + điều khiển | bảng xếp hạng trực tiếp),
   và một cột hẹp, to, dễ bấm bằng một tay cho người chơi trên điện thoại. */
:root{
  --bg:#EEF1F6; --surface:#FFFFFF; --surface2:#F5F7FB; --ink:#101828; --muted:#566178; --line:#D8DEE9;
  --accent:#2447F5; --accent-ink:#FFFFFF; --accent-soft:#E3E9FF;
  --gold:#F2B705; --silver:#B4BDCC; --bronze:#D09469; --on-medal:#101828;
  --ok:#0E8A4A; --ok-soft:#DDF4E7; --bad:#C8321F; --bad-soft:#FCE5E1; --warn-soft:#FFF3CC;
  --f-display:'Bricolage Grotesque','Be Vietnam Pro',system-ui,sans-serif;
  --f-body:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1320; --surface:#171E2F; --surface2:#1D263A; --ink:#EEF1F8; --muted:#9AA6BD; --line:#2A3550;
    --accent:#7E95FF; --accent-ink:#0B1020; --accent-soft:#222E57;
    --gold:#F5C842; --silver:#8F9AB0; --bronze:#C58A5E;
    --ok:#3DD68C; --ok-soft:#14352A; --bad:#FF8A7E; --bad-soft:#3B1D1A; --warn-soft:#3A3114;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1320; --surface:#171E2F; --surface2:#1D263A; --ink:#EEF1F8; --muted:#9AA6BD; --line:#2A3550;
  --accent:#7E95FF; --accent-ink:#0B1020; --accent-soft:#222E57;
  --gold:#F5C842; --silver:#8F9AB0; --bronze:#C58A5E;
  --ok:#3DD68C; --ok-soft:#14352A; --bad:#FF8A7E; --bad-soft:#3B1D1A; --warn-soft:#3A3114;
  color-scheme: dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:15px; line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:16px 40px; margin:0;
}
h1,h2,h3{font-family:var(--f-display); margin:0; line-height:1.15; text-wrap:balance; letter-spacing:-0.01em}
h2{font-size:1.5rem; font-weight:800} h3{font-size:1.1rem; font-weight:600}
p{margin:0}
.wrap{max-width:1080px; margin:0 auto; display:flex; flex-direction:column; gap:20px}
.col{width:100%; max-width:520px; margin:0 auto; display:flex; flex-direction:column; gap:16px}
.muted{color:var(--muted)} .small{font-size:13px}
button,input,textarea{font:inherit; color:inherit}
:focus-visible{outline:3px solid var(--accent); outline-offset:2px}

/* header */
.hdr{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap}
.brand{display:flex; align-items:center; gap:12px; min-width:0}
.brand b{font-family:var(--f-display); font-weight:800; font-size:1.3rem; letter-spacing:-0.02em}
.mark{width:34px; height:34px; border-radius:9px; background:var(--accent); color:var(--accent-ink); display:grid; place-items:center; font-family:var(--f-display); font-weight:800; font-size:1.1rem}
.hdr-r{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.pill{display:inline-flex; align-items:center; gap:6px; padding:4px 11px; border-radius:99px; background:var(--surface); border:1px solid var(--line); font-size:13px; font-weight:600; white-space:nowrap}
.pill i{width:8px; height:8px; border-radius:50%; background:var(--muted); display:inline-block}
.pill.running i{background:var(--ok)} .pill.pick i{background:var(--gold)} .pill.lobby i{background:var(--accent)}

/* controls */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:44px; padding:10px 18px; border-radius:10px; border:1px solid var(--line); background:var(--surface); font-weight:600; cursor:pointer}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn:disabled{opacity:.5; cursor:not-allowed}
.btn.primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
.btn.primary:hover:not(:disabled){filter:brightness(1.08)}
.btn.danger{background:var(--bad); color:var(--surface); border-color:var(--bad)}
.btn.sm{min-height:34px; padding:4px 12px; font-size:13px}
.btn.block{width:100%}
.seg{display:inline-flex; border:1px solid var(--line); border-radius:10px; overflow:hidden; background:var(--surface)}
.seg button{border:0; background:transparent; padding:7px 12px; font-size:13px; font-weight:600; cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink)}
input[type=text],input[type=number],textarea{width:100%; padding:11px 13px; border-radius:10px; border:1px solid var(--line); background:var(--surface); min-height:44px}
textarea{resize:vertical}
label.f{display:flex; flex-direction:column; gap:6px; font-weight:600; font-size:14px}

/* panels */
.panel{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:20px; display:flex; flex-direction:column; gap:14px; min-width:0}
.panel.flat{background:transparent; border-style:dashed}
.grid2{display:grid; grid-template-columns:minmax(0,340px) minmax(0,1fr); gap:20px; align-items:start}
@media (max-width:820px){.grid2{grid-template-columns:minmax(0,1fr)}}
.tabs{display:flex; gap:4px; border-bottom:1px solid var(--line); overflow-x:auto}
.tabs button{border:0; background:transparent; padding:10px 14px; font-weight:600; color:var(--muted); cursor:pointer; border-bottom:3px solid transparent; white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink); border-bottom-color:var(--accent)}
.note{padding:10px 14px; border-radius:10px; background:var(--accent-soft); font-size:14px}
.note.warn{background:var(--warn-soft)}
.note.bad{background:var(--bad-soft)}
.empty{color:var(--muted); padding:18px 0; text-align:center}
.row{display:flex; gap:10px; flex-wrap:wrap; align-items:center}

/* QR */
.qr{background:#fff; padding:12px; border-radius:12px; width:fit-content; margin:0 auto; line-height:0; border:1px solid var(--line)}
.qr img,.qr canvas{max-width:100%}
.linkbox{font-size:12px; word-break:break-all; background:var(--surface2); border-radius:8px; padding:8px 10px; user-select:all}

/* leaderboard */
.tscroll{overflow-x:auto}
table.lb{width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums}
.lb th{font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); text-align:left; padding:6px 10px; font-weight:600; white-space:nowrap}
.lb td{padding:10px; border-top:1px solid var(--line); vertical-align:middle}
.lb .num{text-align:right; white-space:nowrap}
.lb tr.me td{background:var(--accent-soft)}
.rk{display:inline-grid; place-items:center; width:28px; height:28px; border-radius:50%; background:var(--surface2); border:1px solid var(--line); font-family:var(--f-display); font-weight:800; font-size:13px}
.rk.r1{background:var(--gold); border-color:var(--gold); color:var(--on-medal)}
.rk.r2{background:var(--silver); border-color:var(--silver); color:var(--on-medal)}
.rk.r3{background:var(--bronze); border-color:var(--bronze); color:var(--on-medal)}
.tag{display:inline-block; padding:2px 9px; border-radius:99px; font-size:12px; font-weight:600; background:var(--surface2); border:1px solid var(--line)}
.tag.ok{background:var(--ok-soft); border-color:transparent; color:var(--ok)}
.tag.turn{background:var(--gold); border-color:transparent; color:var(--on-medal)}

/* player screens */
.hero{text-align:center; display:flex; flex-direction:column; gap:8px; padding:8px 0}
.hero h2{font-size:1.9rem}
.chips{display:flex; flex-wrap:wrap; gap:8px; justify-content:center}
.chip{padding:5px 12px; border-radius:99px; background:var(--surface2); border:1px solid var(--line); font-size:14px; font-weight:500}
.chip.me{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
.big{font-family:var(--f-display); font-weight:800; font-size:3.2rem; line-height:1; font-variant-numeric:tabular-nums}
.qmeta{display:flex; justify-content:space-between; align-items:baseline; font-weight:600; color:var(--muted)}
.tsec{font-family:var(--f-display); font-weight:800; font-size:1.6rem; color:var(--ink); font-variant-numeric:tabular-nums}
.tbar{height:10px; border-radius:99px; background:var(--line); overflow:hidden}
.tfill{height:100%; width:100%; background:var(--accent); transform-origin:left}
.tfill.low{background:var(--bad)}
.qtext{font-family:var(--f-display); font-weight:600; font-size:1.45rem; line-height:1.3; text-wrap:balance}
.opts{display:flex; flex-direction:column; gap:10px}
.opt{display:grid; grid-template-columns:34px 1fr; gap:12px; align-items:center; text-align:left; width:100%; padding:14px; min-height:60px; border:2px solid var(--line); border-radius:12px; background:var(--surface); font-weight:600; font-size:16px; cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.sel{background:var(--accent-soft); border-color:var(--accent)}
.opt .l{width:34px; height:34px; border-radius:8px; background:var(--surface2); display:grid; place-items:center; font-family:var(--f-display); font-weight:800}
.opt.sel .l{background:var(--accent); color:var(--accent-ink)}
.prizes{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px}
.prize{padding:16px 12px; min-height:84px; border:2px solid var(--line); border-radius:12px; background:var(--surface); font-weight:600; cursor:pointer; font-size:15px}
.prize:hover:not(:disabled){border-color:var(--gold); background:var(--warn-soft)}
.prize:disabled{opacity:.5; cursor:not-allowed}

/* editors */
.qcard{border:1px solid var(--line); border-radius:12px; padding:16px; display:flex; flex-direction:column; gap:12px; background:var(--surface2)}
.qhead{display:flex; justify-content:space-between; align-items:center; gap:8px}
.qtools{display:flex; gap:6px}
.optrow{display:grid; grid-template-columns:auto 28px 1fr; gap:10px; align-items:center}
.optrow input[type=radio]{width:20px; height:20px; accent-color:var(--accent)}
.optrow .ltr{font-family:var(--f-display); font-weight:800; text-align:center}
.timef{display:flex; align-items:center; gap:10px; font-size:14px; font-weight:600}
.timef input{width:90px}
.prow{display:grid; grid-template-columns:28px 1fr auto; gap:10px; align-items:center}
details.h{border:1px solid var(--line); border-radius:12px; background:var(--surface); padding:4px 16px}
details.h summary{cursor:pointer; padding:12px 0; font-weight:600; display:flex; justify-content:space-between; gap:8px}

#toasts{position:fixed; left:0; right:0; bottom:0; padding:16px 16px calc(16px + env(safe-area-inset-bottom, 0px)); display:flex; flex-direction:column; align-items:center; gap:8px; pointer-events:none; z-index:50}
.toast{background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:10px; font-weight:500; max-width:420px; box-shadow:0 6px 20px rgba(0,0,0,.25)}
@media (prefers-reduced-motion: no-preference){
  .tfill{transition:transform .1s linear}
  .toast{animation:up .2s ease-out}
  @keyframes up{from{transform:translateY(8px); opacity:0}to{transform:none; opacity:1}}
}
</style>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<div class="wrap">
  <header class="hdr" id="hdr"></header>
  <main id="main"></main>
</div>
<div id="toasts" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(function(){
const MAX = 20;
const $ = (s, r) => (r || document).querySelector(s);
function el(tag, attrs, ...kids){
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})){
    if (v == null || v === false) continue;
    if (k === 'class') n.className = v;
    else if (k === 'text') n.textContent = v;
    else if (k === 'value') n.value = v;
    else if (k === 'checked') n.checked = true;
    else if (k === 'disabled') n.disabled = true;
    else if (k.slice(0,2) === 'on') n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? '' : v);
  }
  kids.flat(Infinity).forEach(c => { if (c == null || c === false) return; n.append(c.nodeType ? c : document.createTextNode(String(c))); });
  return n;
}
function toast(msg){
  const t = el('div', {class:'toast', text:msg});
  $('#toasts').append(t);
  setTimeout(() => t.remove(), 3200);
}
const fmt = ms => (ms / 1000).toFixed(1) + 's';
const newId = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
const clamp = (n, a, b) => Math.max(a, Math.min(b, n));
function store(k, v){ try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch(e){ return null; } }

const S = {
  booted:false, db:null, uid:null, isAdmin:false, mode:(location.hash === '#choi' ? 'play' : 'admin'), tab:'ctrl',
  main:{round:1, status:'lobby'}, cfg:{questions:[], prizes:[]}, players:[], history:[],
  loaded:{main:false, cfg:false, players:false}, slow:false, err:null,
  full:false, nameDraft:store('quiz_name') || '', urlDraft:null,
  draftQ:null, dirtyQ:false, draftP:null, dirtyP:false,
  qStart:0, qLocked:false, tick:null, chain:Promise.resolve(), busy:false, resetArmed:false,
  lastKey:null, force:false, pending:false, qr:null
};

/* ---------- derived ---------- */
function cmp(a, b){ return (b.correct - a.correct) || (a.timeMs - b.timeMs) || (a.joinedAt - b.joinedAt); }
function roundPlayers(){
  return S.players.filter(p => p.round === S.main.round)
    .sort((a, b) => (a.joinedAt - b.joinedAt) || (a.uid < b.uid ? -1 : 1));
}
const validPlayers = () => roundPlayers().slice(0, MAX);
const ranked = () => validPlayers().sort(cmp);
const getMe = () => validPlayers().find(p => p.uid === S.uid);
const totalQ = () => S.cfg.questions.length;
const isDone = p => p.finished || (p.answers.length >= totalQ() && totalQ() > 0);
function pickPhase(){
  const vp = validPlayers();
  return S.main.status === 'results' || (S.main.status === 'running' && vp.length > 0 && vp.every(isDone));
}
function turnInfo(){
  const rk = ranked();
  const claimed = new Set(rk.map(p => p.prizeId).filter(Boolean));
  const available = S.cfg.prizes.filter(z => !claimed.has(z.id));
  const turn = available.length ? (rk.find(p => !p.prizeId && !p.skipped) || null) : null;
  return {rk, available, turn};
}
const prizeName = id => { const z = S.cfg.prizes.find(x => x.id === id); return z ? z.name : 'Quà đã xóa'; };
function statusLabel(){
  if (S.main.status === 'lobby') return ['lobby', 'Chờ bắt đầu'];
  if (pickPhase()) return ['pick', 'Chọn quà'];
  return ['running', 'Đang chơi'];
}

/* ---------- views ---------- */
function renderHeader(){
  const hdr = $('#hdr');
  const [cls, label] = statusLabel();
  hdr.replaceChildren(
    el('div', {class:'brand'}, el('div', {class:'mark', text:'?'}), el('b', {text:'Đố Vui Nội Bộ'})),
    el('div', {class:'hdr-r'},
      S.booted && S.db ? el('span', {class:'pill ' + cls}, el('i'), 'Lượt ' + S.main.round + ' · ' + label) : null,
      S.isAdmin ? el('div', {class:'seg'},
        el('button', {type:'button', 'aria-pressed': String(S.mode === 'admin'), text:'Quản trị', onclick:() => { S.mode = 'admin'; render(); }}),
        el('button', {type:'button', 'aria-pressed': String(S.mode === 'play'), text:'Xem như người chơi', onclick:() => { S.mode = 'play'; render(); }})
      ) : null
    )
  );
}

function computeView(){
  if (!S.booted) return {key:'load', build:loadingView};
  if (!S.db) return {key:'nodb', build:() => msgCard('Không kết nối được dữ liệu', 'Kiểm tra lại cấu hình Firebase SDK.')};
  if (!(S.loaded.main && S.loaded.cfg && S.loaded.players)) return {key:'load', build:loadingView};
  if (S.isAdmin && S.mode === 'admin') return {key:'admin:' + S.tab, stat:(S.tab === 'q' || S.tab === 'p'), build:adminView};
  return playerView();
}

function loadingView(){
  return el('div', {class:'col'}, el('div', {class:'panel'},
    el('h3', {text:'Đang tải…'}),
    S.slow ? el('p', {class:'muted', text:'Chưa kết nối được dữ liệu. Kiểm tra mạng, app sẽ tự tải khi kết nối lại.'}) : null));
}
function msgCard(title, body, extra){
  return el('div', {class:'col'}, el('div', {class:'panel'}, el('h2', {text:title}), body ? el('p', {class:'muted', text:body}) : null, extra));
}

/* ---- player ---- */
function playerView(){
  if (!S.uid) return {key:'noid', build:() => msgCard('Không nhận diện được tài khoản', 'Đăng nhập tài khoản đã được chia sẻ app rồi mở lại.')};
  const me = getMe();
  const st = S.main.status;
  if (!me){
    if (S.full) return {key:'full', build:() => msgCard('Lượt chơi đã đủ ' + MAX + ' người', 'Mỗi lượt chỉ nhận tối đa ' + MAX + ' người. Bạn có thể chờ lượt sau.', el('button', {class:'btn', type:'button', text:'Thử vào lại', onclick:() => { S.full = false; render(); }}))};
    if (st !== 'lobby') return {key:'closed:' + st, build:() => msgCard(st === 'running' ? 'Lượt chơi đã bắt đầu' : 'Lượt chơi đã kết thúc', 'Bạn chưa vào kịp lượt này. Giữ trang mở, khi có lượt mới bạn sẽ thấy màn hình nhập tên.')};
    return {key:'join:' + S.main.round, stat:true, build:joinView};
  }
  if (st === 'lobby') return {key:'lobby', build:() => lobbyView(me)};
  if (pickPhase()) return {key:'pick', build:() => resultsView(me)};
  if (isDone(me)) return {key:'wait', build:() => waitView(me)};
  if (!totalQ()) return {key:'noq', build:() => msgCard('Chưa có câu hỏi', 'Quản trị viên chưa soạn câu hỏi.')};
  const idx = me.answers.length;
  return {key:'q:' + S.main.round + ':' + idx, stat:true, build:() => questionView(me, idx), after:startTimer};
}

function joinView(){
  const count = validPlayers().length;
  const input = el('input', {type:'text', id:'name', maxlength:40, placeholder:'Ví dụ: Nguyễn Văn An', autocomplete:'name', value:S.nameDraft, oninput:e => { S.nameDraft = e.target.value; }});
  const err = el('p', {class:'small', style:'color:var(--bad)'});
  const form = el('form', {class:'panel', onsubmit:async e => {
    e.preventDefault();
    const name = S.nameDraft.trim().replace(/\s+/g, ' ');
    if (name.length < 2){ err.textContent = 'Hãy nhập họ tên đầy đủ (ít nhất 2 ký tự).'; return; }
    if (validPlayers().some(p => p.name.toLowerCase() === name.toLowerCase())){ err.textContent = 'Đã có người dùng tên này. Thêm tên đệm hoặc số để phân biệt.'; return; }
    if (validPlayers().length >= MAX){ err.textContent = 'Lượt chơi đã đủ ' + MAX + ' người.'; return; }
    err.textContent = '';
    store('quiz_name', name);
    try {
      await S.db.doc('players/' + S.uid).set({round:S.main.round, name, joinedAt:Date.now(), answers:[], correct:0, timeMs:0, finished:false, prizeId:'', skipped:false});
    } catch(ex){ err.textContent = 'Không vào được phòng. Kiểm tra mạng rồi thử lại.'; }
  }},
    el('label', {class:'f', for:'name'}, 'Họ và tên', input),
    err,
    el('button', {class:'btn primary block', type:'submit', text:'Vào phòng chờ'}));
  return el('div', {class:'col'},
    el('div', {class:'hero'}, el('h2', {text:'Tham gia lượt chơi'}), el('p', {class:'muted', text:count + '/' + MAX + ' người đã vào phòng'})),
    form,
    // THÊM NÚT VÀ BẢO MẬT BẰNG MẬT KHẨU
    el('div', {style:'text-align:center; margin-top:20px'},
      el('button', {
        class:'btn sm', 
        type:'button', 
        style:'background:transparent; border:none; color:var(--muted); text-decoration:underline', 
        text:'Vào trang Quản trị (Admin)', 
        onclick:() => { 
          if (sessionStorage.getItem('admin_auth') === '1') {
            S.isAdmin = true; S.mode = 'admin'; location.hash = 'admin'; render();
          } else {
            const pass = prompt('Nhập mật khẩu Quản trị viên:');
            if (pass === 'Xiaomi@123') {
              sessionStorage.setItem('admin_auth', '1');

function startTimer(){
  const q = S.curQ; if (!q) return;
  const duration = q.time * 1000;
  const fill = $('#tfill');

  // 1. Giao việc thu ngắn thanh Progress Bar cho CSS Transition xử lý
  if (fill) {
    fill.style.transition = `transform ${q.time}s linear, background-color 0.3s`;
    // Ép trình duyệt nhận diện trạng thái đầy trước khi chạy animation lùi về 0
    requestAnimationFrame(() => {
      fill.style.transform = 'scaleX(0)';
    });
  }

  // 2. JS chỉ thong thả đếm lùi số mỗi 1 giây (1000ms) thay vì 100ms
  S.tick = setInterval(() => {
    const left = duration - (Date.now() - S.qStart);
    const sec = $('#tsec');
    
    if (sec) sec.textContent = Math.max(0, Math.ceil(left / 1000)) + 's';
    if (fill && left <= 5000) fill.classList.add('low');

    // Khóa đáp án khi hết giờ
    if (left <= 0 && !S.qLocked){
      S.qLocked = true; 
      clearInterval(S.tick);
      document.querySelectorAll('#opts .opt').forEach(b => b.disabled = true);
      submitAnswer({a:-1, c:false, ms:duration});
    }
  }, 1000);
}

function choose(q, i, btn){
  if (S.qLocked) return;
  S.qLocked = true; clearInterval(S.tick);
  const ms = Math.min(Date.now() - S.qStart, q.time * 1000);
  btn.classList.add('sel');
  document.querySelectorAll('#opts .opt').forEach(b => b.disabled = true);
  setTimeout(() => submitAnswer({a:i, c:i === q.correct, ms}), 350);
}
function submitAnswer(item){
  const me = getMe(); if (!me) return;
  const answers = [...me.answers, item];
  const payload = {
    answers, correct:answers.filter(a => a.c).length, timeMs:answers.reduce((s, a) => s + a.ms, 0),
    finished:answers.length >= totalQ()
  };
  S.chain = S.chain.then(() => S.db.doc('players/' + S.uid).update(payload)).catch(() => toast('Chưa lưu được câu trả lời. Kiểm tra kết nối mạng.'));
}

async function saveQuestions(){
  const out = [];
  for (const [i, q] of S.draftQ.entries()){
    const text = q.text.trim(), opts = q.options.map(s => s.trim());
    if (!text) return toast('Câu ' + (i + 1) + ': chưa nhập nội dung.');
    if (opts.filter(Boolean).length < 2) return toast('Câu ' + (i + 1) + ': cần ít nhất 2 đáp án.');
    if (!opts[q.correct]) return toast('Câu ' + (i + 1) + ': đáp án đúng đang để trống.');
    const map = [], options = [];
    opts.forEach((o, k) => { if (o){ map[k] = options.length; options.push(o); } });
    out.push({id:q.id || newId('q'), text, options, correct:map[q.correct], time:clamp(Math.round(+q.time || 20), 5, 120)});
  }
  try { await saveCfg({questions:out}); S.dirtyQ = false; toast('Đã lưu ' + out.length + ' câu hỏi.'); }
  catch(e){ toast('Chưa lưu được. Thử lại.'); }
}

    el('p', {class:'muted small', text:'Người xếp hạng cao nhất chọn quà trước, rồi lần lượt xuống. Nên chuẩn bị ít nhất bằng số người chơi.'}),
    lockBanner(),
    rows.length ? rows : el('p', {class:'empty', text:'Chưa có phần quà nào.'}),
    el('div', {class:'row'},
      el('button', {class:'btn', type:'button', disabled:locked, text:'+ Thêm phần quà', onclick:() => { S.draftP.push({id:newId('z'), name:''}); S.dirtyP = true; forceRender(); }}),
      saveBtn));
}
async function savePrizes(){
  const out = S.draftP.map(z => ({id:z.id || newId('z'), name:z.name.trim()}));
  if (out.some(z => !z.name)) return toast('Có phần quà chưa nhập tên.');
  try { await saveCfg({prizes:out}); S.dirtyP = false; toast('Đã lưu ' + out.length + ' phần quà.'); }
  catch(e){ toast('Chưa lưu được. Thử lại.'); }
}

function historyTab(){
  const list = S.history;
  return el('section', {class:'panel', style:'max-width:760px'},
    el('h3', {text:'Lịch sử các lượt chơi'}),
    list.length ? list.map((h, i) => el('details', {class:'h', open:i === 0},
      el('summary', {}, el('span', {text:'Lượt ' + h.round + ' · ' + (h.rows || []).length + ' người'}), el('span', {class:'muted small', text:new Date(h.endedAt).toLocaleString('vi-VN')})),
      el('div', {class:'tscroll', style:'padding-bottom:12px'}, el('table', {class:'lb'},
        el('thead', {}, el('tr', {}, el('th', {text:'#'}), el('th', {text:'Họ tên'}), el('th', {class:'num', text:'Đúng'}), el('th', {class:'num', text:'Thời gian'}), el('th', {text:'Quà'}))),
        el('tbody', {}, (h.rows || []).map((r, k) => el('tr', {},
          el('td', {}, el('span', {class:'rk' + (k < 3 ? ' r' + (k + 1) : ''), text:String(k + 1)})),
          el('td', {text:r.name}), el('td', {class:'num', text:r.correct + '/' + r.total}), el('td', {class:'num', text:fmt(r.timeMs)}),
          el('td', {text:r.prize || '—'}))))))))
      : el('p', {class:'empty', text:'Chưa có lượt nào kết thúc. Bảng xếp hạng được lưu ở đây mỗi khi bạn reset.'}));
}

/* ---------- render loop ---------- */
let raf = 0;
function schedule(){ if (!raf) raf = requestAnimationFrame(() => { raf = 0; render(); }); }
function render(){
  renderHeader();
  const v = computeView();
  const main = $('#main');
  const same = v.key === S.lastKey;
  
  if (same && v.stat && !(S.force && v.key.indexOf('admin:') === 0)) return;
  const a = document.activeElement;
  if (same && !S.force && a && a !== document.body && a.matches && a.matches('input,textarea') && main.contains(a)){ S.pending = true; return; }
  
  S.force = false; S.pending = false; S.lastKey = v.key;
  clearInterval(S.tick);

  // Cập nhật thông minh: Chỉ thay đổi nội dung Bảng xếp hạng nếu đang ở cùng 1 màn hình
  if (same && !v.stat && main.querySelector('.lb')) {
      const newDom = v.build();
      const oldTable = main.querySelector('.lb');
      const newTable = newDom.querySelector('.lb');
      if (oldTable && newTable) {
          oldTable.replaceWith(newTable);
          // Cập nhật thêm số lượng người đã xong ở header (nếu có)
          const oldMeta = main.querySelector('.qmeta');
          const newMeta = newDom.querySelector('.qmeta');
          if (oldMeta && newMeta) oldMeta.replaceWith(newMeta);
          return;
      }
  }

  // Khúc này giữ nguyên như cũ
  main.replaceChildren(v.build());
  if (v.after) v.after();
}
$('#main').addEventListener('focusout', () => setTimeout(() => { if (S.pending){ S.pending = false; render(); } }, 60));

function checkOverflow(){
  if (!S.loaded.main || !S.loaded.players || !S.uid) return;
  const mine = S.players.some(p => p.uid === S.uid && p.round === S.main.round);
  if (mine && !validPlayers().some(p => p.uid === S.uid)){
    S.full = true;
    if(S.db && S.uid) S.db.doc('players/' + S.uid).delete().catch(() => {});
  }
}

/* ---------- boot ---------- */
(async function boot(){
  render();
  setTimeout(() => { if (!(S.loaded.main && S.loaded.cfg && S.loaded.players)){ S.slow = true; schedule(); } }, 10000);

  // 1. Khai báo DB thật: Gắn config Firebase của đại ca vào đây
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
    projectId: "YOUR_PROJECT_ID"
  };

  if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
  }
  S.db = firebase.firestore();
  S.booted = true;

  // 2. Cấp UID ẩn danh cho người chơi & Phân quyền Admin
  S.uid = store('quiz_uid');
  if (!S.uid) {
    S.uid = 'user_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
    store('quiz_uid', S.uid);
  }
  
  // BẢO MẬT TRANG ADMIN
  if (location.hash === '#admin') {
    if (sessionStorage.getItem('admin_auth') === '1') {
      S.isAdmin = true;
      S.mode = 'admin';
    } else {
      location.hash = ''; // Xóa hash nếu chưa đăng nhập, để tránh lộ màn hình
    }
  }

  const onErr = e => { S.err = e && e.code; toast('Mất kết nối dữ liệu. Nhớ mở Rule Firebase nhé đại ca.'); };

  // 3. Khởi chạy luồng dữ liệu (Đã áp dụng tối ưu query Read Firebase)
  S.db.doc('state/main').onSnapshot(s => {
    const prev = S.main.round;
    S.main = Object.assign({round:1, status:'lobby'}, s.exists ? s.data() : {});
    if (prev !== S.main.round){ S.full = false; S.resetArmed = false; }
    S.loaded.main = true; checkOverflow();
    if (S.lastKey && S.lastKey.indexOf('admin:') === 0) S.force = true;
    schedule();
  }, onErr);

  S.db.doc('config/main').onSnapshot(s => {
    S.cfg = Object.assign({questions:[], prizes:[]}, s.exists ? s.data() : {});
    if (!S.dirtyQ) S.draftQ = cloneQs();
    if (!S.dirtyP) S.draftP = cloneZs();
    S.loaded.cfg = true;
    if (S.lastKey && S.lastKey.indexOf('admin:') === 0 && !S.dirtyQ && !S.dirtyP) S.force = true;
    schedule();
  }, onErr);

  // Lọc trực tiếp vòng hiện tại để không kéo thừa data lịch sử
  S.db.collection('players').where('round', '==', S.main.round).onSnapshot(snap => {
    S.players = snap.docs.map(d => { const x = d.data(); return Object.assign({round:0, name:'', joinedAt:0, answers:[], correct:0, timeMs:0, finished:false, prizeId:'', skipped:false}, x, {uid:d.id}); });
    S.loaded.players = true; checkOverflow(); schedule();
  }, onErr);

  if (S.isAdmin){
    S.db.collection('history').orderBy('round', 'desc').limit(50).onSnapshot(snap => {
      S.history = snap.docs.map(d => d.data()); schedule();
    }, onErr);
  }
  render();
})();
})();
</script>
